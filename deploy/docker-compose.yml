services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yoklama
      POSTGRES_USER: yoklama
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in deploy/.env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Not published: only the app container talks to the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoklama -d yoklama"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/yoklama
      SPRING_DATASOURCE_USERNAME: yoklama
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in deploy/.env}
      APP_MASTER_SECRET: ${APP_MASTER_SECRET:?APP_MASTER_SECRET must be set (openssl rand -base64 32)}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-https://${DOMAIN:-localhost}}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD must be set}
      APP_FRAMES_DIR: /app/data/frames
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - frame_data:/app/data/frames
    # Direct access for local testing only; public traffic goes through Caddy (HTTPS).
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pg_data:
  frame_data:
  caddy_data:
